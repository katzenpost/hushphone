name: Release

# A tag v* builds the Linux binary and the Android APK and publishes them as a GitHub release.
# Pull requests that change this file build both without publishing.
#
# The APK is signed with the keystore in the ANDROID_KEYSTORE secret (base64 of a .jks holding
# one key) and its password in ANDROID_KEYSTORE_PASSWORD. Releases keep one key, so that each
# APK installs over the last; a tag without these secrets fails.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'test' }}

jobs:
  linux:
    # The oldest supported runner, so the binary runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Package
        run: |
          name=hushphone-$VERSION-linux-x86_64
          mkdir $name
          cp target/release/hushphone README.md LICENSE $name/
          tar czf $name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: hushphone-*.tar.gz

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked --version 0.10.0
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
            echo "::add-mask::$PASSWORD"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> $GITHUB_ENV
          elif [ "$VERSION" != test ]; then
            echo "::error::a release needs the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets"
            exit 1
          else
            keytool -genkeypair -keystore $RUNNER_TEMP/release.jks -storepass throwaway -keypass throwaway \
              -alias hushphone -keyalg RSA -keysize 4096 -validity 1 -dname CN=hushphone-test
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=throwaway" >> $GITHUB_ENV
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - run: cargo apk build --release --lib
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Check
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify target/release/apk/hushphone.apk
          unzip -l target/release/apk/hushphone.apk | grep -E 'lib/(arm64-v8a|x86_64)/libhushphone.so'
          mv target/release/apk/hushphone.apk hushphone-$VERSION.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: hushphone-*.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum hushphone-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hushphone-*
            SHA256SUMS
          generate_release_notes: true
