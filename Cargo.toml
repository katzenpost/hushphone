[package]
name = "hushphone"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Group chat over the Katzenpost mixnet, for Linux and Android"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# For test builds only: lets Android screenshots and screen recording see the window.
test-screenshots = []
# The mesh's second transport, `--rns python`: the official Python RNS, embedded through PyO3.
reticulum-py = ["pigeonhole_protocols/reticulum-py"]

[[bin]]
name = "hushphone"
path = "src/main.rs"

[dependencies]
slint = "=1.18.1"
# katzenpost/pigeonhole_protocols#45: the katzenqt1 ping message.
pigeonhole_protocols = { git = "https://github.com/katzenpost/pigeonhole_protocols", rev = "331708200e69ea161457f5386939ac64c28367e9", features = ["reticulum-rs"] }
# The same revision pigeonhole_protocols builds on (katzenpost/thin_client#100), so that there is
# one ThinClient type; back to crates.io once it is released.
katzenpost_thin_client = { git = "https://github.com/katzenpost/thin_client", rev = "98ff985ad348156eccbe7d3f4c4849a47041f2d3" }
rustic_audio = { git = "https://github.com/katzenpost/rustic_audio", rev = "5d0505b02708f63ba24c0d5f00c2b16124249228" }
# The speaker and microphone for vouchers by sound: the cpal rustic_audio is built on.
cpal = "0.17.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-security = "0.1.2"
unicode-segmentation = "1.13"
unicode-normalization = "0.1"
infer = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
zeroize = "1"
qrcodegen = "1.8"
rqrr = { version = "=0.11.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7"
arboard = { version = "3.7", features = ["wayland-data-control"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", features = ["backend-android-activity-06"] }
tokio = { version = "1", features = ["net", "io-util", "rt"] }
jni = "0.21"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile = "3"
proptest = "1"

# The Android manifest is packaging/android/AndroidManifest.xml; scripts/build-apk.sh makes the APK.

# One codegen unit: with several, LLVM names symbols after the build directory, and the
# release would not be reproducible.
[profile.release]
codegen-units = 1

