[package]
name = "hushphone"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Group chat over the Katzenpost mixnet, for Linux and Android"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# For test builds only: lets Android screenshots and screen recording see the window.
test-screenshots = []

[[bin]]
name = "hushphone"
path = "src/main.rs"

[dependencies]
slint = "=1.18.1"
pigeonhole_protocols = { git = "https://github.com/katzenpost/pigeonhole_protocols", rev = "54df59a5553e4b527da13338f2150eebf06cfce5" }
katzenpost_thin_client = "=0.0.25"
rustic_audio = { git = "https://github.com/katzenpost/rustic_audio", rev = "0be624803b12fd2d00d6804ff692f468aaa5c10d" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-security = "0.1.2"
unicode-segmentation = "1.13"
unicode-normalization = "0.1"
infer = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
zeroize = "1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "open_uri"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", features = ["backend-android-activity-06"] }
tokio = { version = "1", features = ["net", "io-util", "rt"] }
jni = "0.21"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile = "3"
proptest = "1"

[package.metadata.android]
package = "network.katzenpost.hushphone"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
apk_name = "hushphone"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 36

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

# kpclientd-android's connect provider, the only way this app reaches the mixnet.
[[package.metadata.android.queries.provider]]
authorities = "org.hoi_polloi.kpdaemon.connect"
name = "org.hoi_polloi.kpdaemon.ConnectProvider"

[package.metadata.android.application]
label = "hushphone"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode"
launch_mode = "singleTop"

# One codegen unit: with several, LLVM names symbols after the build directory, and the
# release would not be reproducible.
[profile.release]
codegen-units = 1

